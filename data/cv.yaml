# ---------------------------------------------------------------------------
# Colin Crossman — CV data
#
# This file is the single source of truth for the CV rendered at crc32.com.
# layouts/index.html reads it and renders each section in the order below.
#
# Conventions:
#   - Dates are "YYYY-MM" (or "YYYY-MM-DD" for publications). Leave `end`
#     empty for a current role; it renders as "Present".
#   - Bullets are Markdown (links, *italics*, **bold** all work).
#   - Newest entries go first in every list.
# ---------------------------------------------------------------------------

profile:
  name: Colin Crossman
  headline: Deputy Secretary of State, State of Wyoming
  location: Cheyenne, Wyoming
  email: colin@crc32.com
  # Phone: `phone` is E.164 (used for tel: links and schema.org);
  # `phone_display` is how it's printed.
  phone: "+19194523333"
  phone_display: "+1 (919) 452-3333"
  # Short bio shown under the name. Markdown allowed.
  summary: >-
    Attorney admitted in Wyoming and North Carolina and registered before the
    USPTO. I run day-to-day operations at the Wyoming Secretary of State's
    Office, write about Bitcoin and the law for *Bitcoin Magazine*, and build
    tools in Python. Before public service I spent fifteen years as an operator
    and general counsel for businesses in hospitality, e-commerce, and digital
    infrastructure, after training in law and computational biology at Duke.

# ---------------------------------------------------------------------------
# Experience. One entry per organization; `roles` lists titles held there
# (newest first). `bullets` describe the work.
# ---------------------------------------------------------------------------
experience:
  - org: Secretary of State's Office, State of Wyoming
    roles:
      - title: Deputy Secretary of State
        location: Cheyenne, WY
        start: 2025-11
        end:
    bullets:
      - Coordinate agency-wide operations and strategy across core regulatory and public-service functions (business entities/UCC, securities, notaries, public records, and related services).
      - Lead legislative and policy development in partnership with the Governor's office, AG's office, and legislative committees; translate statutory changes into executable procedures and public-facing guidance.
      - Oversee modernization initiatives (process redesign, data governance, cybersecurity alignment, vendor management/procurement), with measurable SLAs and dashboards for throughput, accuracy, and cost.
      - Direct intergovernmental coordination on CTA/BOI issues with FinCEN and state partners; align state systems with evolving federal compliance while safeguarding state transparency and privacy standards.
      - Support litigation/rulemaking posture, including amicus strategy on matters touching state regulatory authority and technology sovereignty.
      - Build leadership capacity, mentoring managers, strengthening succession pipelines, and institutionalizing continuous-improvement practices.

  - org: Secretary of State's Office, State of Wyoming
    roles:
      - title: Director of the Business Division
        location: Cheyenne, WY
        start: 2023-04
        end: 2025-11
    bullets:
      - Led the division managing high-volume corporate filings (600K+/year), aligning operations with evolving data protection, KYC/AML, and public record transparency standards; coordinated the state-level response to FinCEN's Corporate Transparency Act Beneficial Ownership Information rule.
      - Resolved cross-functional legal and operational issues through inter-agency coordination across legal, IT, and policy teams, improving legal accuracy and filing turnaround through deep knowledge of Wyoming corporate law.
      - Advised on legislative reforms involving business and privacy law; shaped state-level data governance through statutory analysis and collaboration with counsel.
      - Testified before the Wyoming Legislature on modernized digital business infrastructure, including reforms affecting privacy, data access, and automation; coordinated cross-agency input from legal, policy, and IT teams.
      - Co-authored an amicus brief to the U.S. Supreme Court in *[Texas Top Cop Shop v. Garland](/wysos-lummis-sct-amicus-cta.pdf)* on state regulatory authority, technology sovereignty, and data control.
      - Prepared and filed an amicus brief on behalf of the Wyoming Secretary of State in the *[Custodia Bank v. Federal Reserve](https://www.courtlistener.com/docket/68486662/010011075367/custodia-bank-v-federal-reserve-board-of-governors/)* appeal.
      - Built Python automation to streamline corporate name checks, saving ~1 FTE/day of manual review and raising processing throughput by 7%.

  - org: Distributed Hash
    roles:
      - title: Member & In-House Counsel
        location: Wyoming
        start: 2022-01
        end: 2025-10
    bullets:
      - Served as general counsel for all legal matters, negotiating infrastructure and data-hosting contracts, including academic partnerships, with attention to privacy compliance, IP safeguards, and commercial viability.
      - Directed design and launch of a digital infrastructure facility, overseeing regulatory approvals across jurisdictions and compliance with environmental, data-handling, and emerging crypto/tech law.
      - Built internal compliance systems in Python/SQL for real-time monitoring and audit-ready records.
      - Developed Python automation for remote infrastructure control, improving uptime and reducing manual risk.
      - Published regulatory insights and whitepapers for investors and policymakers on energy use, infrastructure, and compute-intensive systems.
      - Led regulatory engagement with local authorities to secure permits, and negotiated long-term infrastructure and utility service agreements.
      - Oversaw multi-jurisdictional compliance, including zoning, data governance, and operational disclosures.

  - org: Rhea Hospitality
    roles:
      - title: Principal and General Counsel
        location: Cary, NC & Las Vegas, NV
        start: 2007-11
        end: 2023-04
    bullets:
      - Founded and led a multi-state hospitality group, overseeing legal, financial, and regulatory operations for a 135-person team and $7M+ in annual revenue; served as de facto general counsel for all contracts, compliance, and risk management.
      - Drafted and negotiated commercial agreements across construction, vendor, and financing; provided in-house counsel across multiple jurisdictions.
      - Structured and closed $17M+ in capital through private placements, public funding, and municipal partnerships; led all legal due diligence, regulatory compliance, and investor disclosures.
      - Structured a Regulation A+ offering via a Delaware PBC, managing SEC disclosure and investor-protection requirements in preparation for Tier 2 qualification.
      - Drafted and secured zoning and permitting approvals across jurisdictions.
      - Designed and deployed internal legal/ops automation tools (Python, SQL, Flask), streamlining payroll and compliance workflows and saving $100K+ annually in operational overhead.

  - org: PhD Posters, LLC
    roles:
      - title: Member and General Counsel
        location: Durham, NC
        start: 2005-11
        end: 2023-04
    bullets:
      - Provided end-to-end legal leadership for a $1.2M+ multi-location e-commerce operation; oversaw commercial contracts, IP protection, and data compliance across digital and physical retail.
      - Drafted consumer-facing terms, franchise agreements, and IP filings; managed brand protection strategy, including a federal trademark portfolio.
      - Directed international legal and tax strategy for a Canadian subsidiary; managed outside counsel and cross-border compliance with consumer protection and data regulations.
      - Led legal structuring for the transition to a national e-commerce model.
      - Acted as general counsel for all business operations, handling employment matters, dispute resolution, and commercial contracts.

  - org: Foundation for Individual Rights and Expression (FIRE)
    roles:
      - title: IT Consultant
        location: Philadelphia, PA
        start: 2020-07
        end: 2023-04
      - title: Senior Program Officer
        location: Philadelphia, PA
        start: 2015-05
        end: 2016-01
    bullets:
      - Researched and classified university speech codes for constitutional compliance; worked with university administrators to bring policy language in line with First Amendment standards.
      - Developed a Python-based tracking system to monitor outreach progress.
      - Designed and deployed a 3CX-based internal VoIP system, modernizing office communications and reducing IT overhead.
      - Led the organization-wide migration from LastPass to Okta, strengthening security posture and access control.
      - Provided on-demand technical consulting across web infrastructure, cybersecurity, and internal systems.

  - org: Triangle Apartment Association
    roles:
      - title: Government Affairs Director
        location: Raleigh, NC
        start: 2008-01
        end: 2009-03
    bullets:
      - Developed and directed the association's governmental and regulatory policy objectives.
      - Analyzed proposed legislation, rules, and case law and determined their impact on the membership; educated members on developments and coordinated member responses.
      - Advocated with elected officials at the municipal, state, and federal levels, across parties, and coordinated with allied groups to increase impact.

  - org: Duke University School of Law
    roles:
      - title: Faculty Fellow for IP Law
        location: Durham, NC
        start: 2005-01
        end: 2006-08
    bullets:
      - Faculty fellow at the Center for the Study of Public Genomics.
      - Researched the effects of university-owned software patents, focusing on the creation and dissemination of genomic data.
      - Developed and taught an upper-level law course on Intellectual Property Licensing.
      - Produced and presented academic research at conferences.

